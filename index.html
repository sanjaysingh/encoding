<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Free online tool for encoding and decoding text in various formats including Base64, Base62, URL, JSON, and XML. Convert your text easily with real-time preview.">
    <meta name="keywords" content="encode, decode, base64, base62, url, json, xml, text converter, online tools">
    <meta name="robots" content="index, follow">
    <meta name="color-scheme" content="dark light">
    <meta name="theme-color" content="#0b0d10">
    <link rel="canonical" href="https://encoding.sanjaysingh.net">
    <title>Encode — Text Encoding and Decoding</title>
    <script>
        (function () {
            try {
                var saved = localStorage.getItem('theme');
                var theme = saved || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
                document.documentElement.setAttribute('data-theme', theme);
            } catch (e) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>
    <link rel="stylesheet" href="styles.css?v={{COMMIT_SHA}}">
</head>
<body>
    <div class="notification" id="notification" role="status" aria-live="polite"></div>

    <header class="topbar">
        <div class="shell topbar-content">
            <div class="brand">
                <span class="brand-mark" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                        <path d="M8 7 3 12l5 5M16 7l5 5-5 5M14 4l-4 16" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </span>
                <div class="brand-copy">
                    <h1 class="topbar-title">Encode</h1>
                    <p class="brand-lede">Text encoding and decoding</p>
                </div>
            </div>
            <button class="icon-btn" id="themeToggle" type="button" aria-label="Toggle dark mode">
                <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                    <path d="M20 14.5A8.5 8.5 0 1 1 9.5 4 7 7 0 0 0 20 14.5z" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                    <circle cx="12" cy="12" r="4"/>
                    <path d="M12 3v2M12 19v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M3 12h2M19 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4" stroke-linecap="round"/>
                </svg>
            </button>
        </div>
    </header>

    <main class="shell">
        <section class="controls" role="toolbar" aria-label="Encoding controls">
            <label class="field">
                <span class="field-label">Format</span>
                <select id="encodingType" aria-label="Select encoding type">
                    <option value="base64">Base64</option>
                    <option value="base32">Base32</option>
                    <option value="base62">Base62</option>
                    <option value="hex">Hexadecimal</option>
                    <option value="html">HTML Entities</option>
                    <option value="xml">XML Entities</option>
                    <option value="url">URL</option>
                    <option value="json">JSON</option>
                </select>
            </label>

            <div class="field">
                <span class="field-label">Mode</span>
                <div class="segmented" role="radiogroup" aria-label="Operation type">
                    <label class="segment">
                        <input type="radio" name="operation" id="encodeRadio" value="encode" checked aria-label="Encode text">
                        <span>Encode</span>
                    </label>
                    <label class="segment">
                        <input type="radio" name="operation" id="decodeRadio" value="decode" aria-label="Decode text">
                        <span>Decode</span>
                    </label>
                </div>
            </div>

            <p class="format-hint" id="formatHint"></p>

            <div class="toolbar-actions">
                <button class="btn btn-ghost" id="swapBtn" type="button" aria-label="Swap input and output">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                        <path d="M7 8h13M7 8l3-3M7 8l3 3M17 16H4M17 16l-3-3M17 16l-3 3" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    Swap
                </button>
                <button class="btn btn-ghost" id="clearBtn" type="button" aria-label="Clear input and output">
                    Clear
                </button>
            </div>
        </section>

        <div class="workspace">
            <section class="panel">
                <div class="panel-head">
                    <h2>Input</h2>
                    <div class="input-tabs" role="tablist" aria-label="Input source">
                        <button class="input-tab active" id="textTab" type="button" role="tab" aria-selected="true" aria-controls="textInputContainer">Text</button>
                        <button class="input-tab" id="fileTab" type="button" role="tab" aria-selected="false" aria-controls="fileInputContainer">File</button>
                    </div>
                </div>
                <div id="textInputContainer" role="tabpanel" aria-labelledby="textTab">
                    <textarea id="inputText" rows="10" placeholder="Enter text to encode or decode" aria-label="Input text" spellcheck="false" autocomplete="off"></textarea>
                </div>
                <div id="fileInputContainer" role="tabpanel" aria-labelledby="fileTab" hidden>
                    <label class="dropzone" id="dropzone">
                        <span class="dropzone-title" id="fileName">Drop a file or click to browse</span>
                        <span class="dropzone-hint">Processed locally in your browser</span>
                        <input type="file" id="inputFile" aria-label="Upload file">
                    </label>
                </div>
                <div class="panel-meta" id="inputMeta">Empty</div>
            </section>

            <section class="panel">
                <div class="panel-head">
                    <h2>Output</h2>
                    <div class="panel-actions">
                        <button class="icon-btn copy-btn" id="copyBtn" type="button" aria-label="Copy to clipboard" disabled>
                            <svg class="icon-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                                <rect x="9" y="9" width="11" height="11" rx="2"/>
                                <path d="M5 15V5a2 2 0 0 1 2-2h10" stroke-linecap="round"/>
                            </svg>
                            <svg class="icon-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                                <path d="M5 12.5 9.5 17 19 7" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </button>
                        <button class="btn btn-primary" id="downloadBtn" type="button" aria-label="Download output" disabled>
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                                <path d="M12 4v12M7 11l5 5 5-5M5 20h14" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                            Download
                        </button>
                    </div>
                </div>
                <textarea id="outputText" rows="10" readonly aria-label="Output text" spellcheck="false" placeholder="Result appears here"></textarea>
                <div class="panel-meta" id="outputMeta">Empty</div>
            </section>
        </div>
    </main>

    <footer class="shell site-footer">
        <p>Everything runs in your browser. Nothing is uploaded.</p>
    </footer>

    <script type="module" src="app.js?v={{COMMIT_SHA}}"></script>
</body>
</html>
