# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Inject commit SHA into version placeholders
        run: |
          COMMIT_SHA="${{ github.sha }}"
          SHORT_SHA="${COMMIT_SHA:0:7}"

          echo "Injecting commit SHA: ${SHORT_SHA}"

          # Replace placeholders in all relevant files
          sed -i "s/{{COMMIT_SHA}}/${SHORT_SHA}/g" index.html
          sed -i "s/{{COMMIT_SHA}}/${SHORT_SHA}/g" app.js

          # Verify replacements
          echo "=== index.html version references ==="
          grep -o 'v=[a-f0-9]*' index.html | head -5

          echo "=== app.js version references ==="
          grep -o 'v=[a-f0-9]*' app.js | head -2

      - name: Validate version injection
        run: |
          # Check that placeholders were replaced
          if grep -q '{{COMMIT_SHA}}' index.html; then
            echo "ERROR: Unreplaced placeholder found in index.html"
            exit 1
          fi

          if grep -q '{{COMMIT_SHA}}' app.js; then
            echo "ERROR: Unreplaced placeholder found in app.js"
            exit 1
          fi

          echo "Version injection validated successfully"

      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
